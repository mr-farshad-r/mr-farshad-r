<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    {% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
    <link rel="icon" type="image/png" href="{{ '/assets/images/avatar.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="{{ '/assets/styles/styles.css' | relative_url }}" rel="stylesheet">

    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "l7t2mnoj0i");
    </script>
</head>

<body class="layout-{{ page.layout | default: 'home' }}">

    {{ content }}

    <script>
        // --- Terminal-style typing effect ---
        const phrases = [
            "scalable React apps.",
            "accessible UIs.",
            "design systems.",
            "modern web experiences."
        ];
        let phraseIndex = 0, charIndex = 0, isDeleting = false;
        const typedEl = document.getElementById("typed");

        function typeLoop() {
            const current = phrases[phraseIndex];
            if (isDeleting) {
                typedEl.textContent = current.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typedEl.textContent = current.substring(0, charIndex + 1);
                charIndex++;
            }
            let delay = isDeleting ? 35 : 75;
            if (!isDeleting && charIndex === current.length) {
                delay = 1800;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                delay = 250;
            }
            setTimeout(typeLoop, delay);
        }

        // --- Slide-in About panel ---
        function openAbout() {
            const panel = document.getElementById("about-panel");
            panel.classList.add("open");
            document.body.style.overflowY = "hidden";
        }

        function closeAbout() {
            const panel = document.getElementById("about-panel");
            panel.classList.remove("open");
            document.body.style.overflowY = "auto";
        }

        // --- Start typing if element exists ---
        if (typedEl) typeLoop();
    </script>

</body>

</html>
