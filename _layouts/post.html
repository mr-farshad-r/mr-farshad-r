---
layout: default
---

<article class="post">

    <header class="post-header">
        <a href="{{ '/' | relative_url }}" class="back-link">&larr; Back</a>
        <h1>{{ page.title }}</h1>
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </header>

    <div class="post-content">
        {{ content }}
    </div>

</article>
